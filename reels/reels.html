<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reels</title>
    <!--!Enlace de bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--!Enlace de bootstrap para iconos-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!--!Enlace al CSS-->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!--!Se utilizo un Grid para simular los elementos de la pantalla de reels-->
    <div class="container text-center text-bg-dark p-3">
        <br>
        <br>
        <br>
        <div class="row">
            <!--!Sección de íconos-->
            <div class="col-1">
                <i class="bi bi-instagram"></i>
                <br>
                <br>
                <i class="bi bi-caret-right-square-fill"></i>
                <br>
                <br>
                <i class="bi bi-camera-reels-fill"></i>
                <br>
                <br>
                <i class="bi bi-chat-dots-fill"></i>
                <br>
                <br>
                <i class="bi bi-search"></i>
                <br>
                <br>
                <i class="bi bi-heart"></i>
                <br>
                <br>
                <i class="bi bi-plus"></i>
                <br>
                <br>
                <i class="bi bi-person"></i>
                <br>
                <br>
                <i class="bi bi-three-dots"></i>
                <br>
                <br>
            </div>

            <!--!Sección de la descripción-->
            <div class="col-4">
                <br>
                <br>
                <br>
                <br>
                <br>
                <br>
                <br>
                <br>
                <br>
                <br>
                <br>
                <br>
                viricooks <i class="bi bi-check-circle-fill"></i> <i class="bi bi-circle-fill"></i> Follow
                <br>
            PALETAS DE PAY DE LIMON 🍋​​✨​
            <br>
            Quedan deliciosas!! Super cremositas y aciditas ​😍​ me recordaron a la Carlota de...
            </div>

            <!--!Sección del vídeo/imagen-->
            <div class="col-2">
            <img src="assets/Paleta de pay de limón.jpg" alt="Paleta de pay de limón" width="100%" height="100%">
            </div>

            <!--!Sección de íconos para comentar el reel-->
            <div class="col-1">
            <br>
            <br>
            <br>
            <br>
            <i class="bi bi-heart"></i>
            <br>
            <br>
            <i class="bi bi-chat"></i>
            <br> 
            <br>
            <i class="bi bi-repeat"></i>
            <br> 
            <br>
            <i class="bi bi-share"></i>
            <br> 
            <br>
            <i class="bi bi-bookmark"></i>
            <br> 
            <br>
            <br>
            <i class="bi bi-three-dots"></i>
            </div>

            <!--!Sección de flechas-->
            <div class="col-4">
            <br>
            <br>
            <br>
            <br>
            <br>
            <br>
            <br>
            <br>
            <i class="bi bi-arrow-up-circle"></i>
            <br>
            <i class="bi bi-arrow-down-circle"></i>
            </div>
        </div>
    </div>

<!--!Enlace de bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
