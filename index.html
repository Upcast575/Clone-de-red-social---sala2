<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram-Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    

<div class="container">
    <div class="row align-items-center">
    




<!-- IZQUIERDA -->

<div class="col-md-8 position-relative text-center">
  <img src="https://www.clipartmax.com/png/middle/185-1851591_peque%C3%B1o-icono-de-instagram.png" alt="logo-Instagram" class="position-absolute top-0 start-0 m-4 logo-ig">

  <h1 class="fw-bold mt-5 pt-5 titulo">
    Mira los momentos cotidianos<br>
    de tus <span class="degradado">mejores amigos</span>.
  </h1>

  <img src="Captura de pantalla 2026-08-17 a la(s) 1.35.41 p.m..png" alt="" class="img-fluid mt-4 imagen-collage">
</div>









        <!-- DERECHA -->
        <div class="col-md-4 d-flex justify-content-end">

            <form class="login">
<h6>
    Inicia sesión en instagram
</h6>

  <input type="email" class="form-control inputs-ig" id="exampleFormControlInput1" placeholder="Número de celular, nombre de usuario o correo electrónico">

<br>

<input type="Contraseña" class="form-control inputs-ig" id="exampleFormControlInput1" placeholder="Contraseña">

<br>

<div class="d-grid gap-2">
  <button class="btn btn-primary boton-login" type="button">Iniciar sesión</button>
</div>
<br>

<p class="párrafo1">¿Olvidaste tu contraseña?</p>

<br>

<div class="d-grid gap-2 face">
  <button class="btn boton-facebook" type="button">Iniciar sesión con Facebook</button>
  <button type="button" class="btn boton-crear">Crear cuenta nueva</button>
</div>
</form>
</div>
</div>
</div>
</body>
    


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<!--footer-->

<p class="footer"> Español © 2026 Instagram from Meta</p>


</body>
</html>
