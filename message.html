<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message</title>
    <!--CSS Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--Icon en header de pagina-->
    <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/instagram.svg">
    <!--CSS personalizado-->
    <link rel="stylesheet" href="/Clone-de-red-social---sala2/message-styles.css">
    <!--Icons Bootstrap-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
  <!-- Grid de Bootstrap, Sizing, Background y Colors -->
    <div class="container-fluid vh-100 bg-dark text-white"><!-- Sizing, Background, Colors -->
      <div class="row h-100"><!-- Sizing -->
        
        <!-- 1. Columna lateral izquierda icono "send" -->
        <div class="col-1 border-end d-flex justify-content-center py-4"><!-- Borders, Flex, Spacing -->
          <i class="bi bi-send-arrow-up-fill fs-3"></i><!-- Bootstrap Icons, Typography -->
        </div>

        <!-- 2. Columna central de Mensajes, Notas y Buscador -->
        <div class="col-3 border-end p-3 h-100 overflow-auto"><!-- Borders, Spacing, Sizing, Overflow -->
          
          <!-- Encabezado de usuario -->
          <div class="d-flex justify-content-between align-items-center mb-3"><!-- Flex, Spacing -->
            <span class="fw-bold fs-5"><!-- Typography -->
              Instagram</i>
            </span>
            <i class="bi bi-pencil-square fs-5"></i><!-- Bootstrap Icons, Typography -->
          </div>

          <!-- Buscador -->
          <div class="input-group mb-4"><!-- Input group, Spacing -->
            <span class="input-group-text bg-dark border-secondary text-secondary" id="addon-wrapping"><i class="bi bi-search"></i></span><!-- Background, Borders, Colors -->
            <input type="text" class="form-control bg-dark border-secondary text-white" placeholder="Search" aria-label="Search" aria-describedby="addon-wrapping"><!-- Forms, Background, Borders, Colors -->
          </div>

          <!-- Fila de notas horizontales -->
          <div class="d-flex gap-3 overflow-auto pb-2 mb-3"><!-- Flex, Spacing, Overflow -->
            <div class="text-center" style="min-width: 65px;"><!-- Typography -->
              <img src="/Clone-de-red-social---sala2/icon-ib/image.png" class="image-r rounded-circle mb-1" alt="random-internet"><!-- Borders (rounded-circle), Spacing -->
              <small class="d-block text-secondary text-truncate" style="font-size: 11px;">User</small><!-- Display, Colors, Text -->
            </div>
            <div class="text-center" style="min-width: 65px;"><!-- Typography -->
              <img src="/Clone-de-red-social---sala2/icon-ib/image2.png" class="image-r rounded-circle mb-1" alt="User note"><!-- Borders (rounded-circle), Spacing -->
              <small class="d-block text-secondary text-truncate" style="font-size: 11px;">User</small><!-- Display, Colors, Text -->
            </div>
          </div>

          <!-- Subtítulo de sección de mensajes -->
          <div class="d-flex justify-content-between align-items-center mb-3"><!-- Flex, Spacing -->
            <span class="fw-bold">Messages</span><!-- Typography -->
            <small class="text-secondary">Requests</small><!-- Colors -->
          </div>

          <!-- Lista de conversaciones -->
          <div class="d-flex flex-column gap-2"><!-- Flex, Spacing -->
            
            <!-- Chat Item 1 -->
            <div class="d-flex align-items-center gap-3 p-2 rounded"><!-- Flex, Spacing, Borders -->
              <img src="/Clone-de-red-social---sala2/icon-ib/image2.png" class="image-r rounded-circle" alt="User"><!-- Borders (rounded-circle) -->
              <div class="d-flex flex-column"><!-- Flex -->
                <span class="fw-semibold" style="font-size: 14px;"><!-- Typography -->
                  User <i class="bi bi-patch-check-fill text-primary" style="font-size: 12px;"></i><!-- Bootstrap Icons, Colors -->
                </span>
                <span class="text-secondary" style="font-size: 12px;">Message text · 1w</span><!-- Colors -->
              </div>
            </div>

            <!-- Chat Item 2 -->
            <div class="d-flex align-items-center gap-3 p-2 rounded"><!-- Flex, Spacing, Borders -->
              <img src="/Clone-de-red-social---sala2/icon-ib/image.png" class="image-r rounded-circle" alt="User"><!-- Borders (rounded-circle) -->
              <div class="d-flex flex-column"><!-- Flex -->
                <span class="fw-semibold" style="font-size: 14px;"><!-- Typography -->
                  User</span><!-- Typography -->
                <span class="text-secondary" style="font-size: 12px;">Message text · 2w</span><!-- Colors -->
              </div>
            </div>

          </div>
        </div>

        <!-- 3. Columna derecha "Your messages" -->
        <div class="col-8 d-flex flex-column align-items-center justify-content-center h-100 text-center"><!-- Grid, Flex, Sizing, Typography -->
          
          <!-- Círculo central con icono -->
          <div class="border border-2 border-white rounded-circle d-flex align-items-center justify-content-center mb-3" style="width: 95px; height: 95px;"><!-- Borders, Flex, Spacing -->
            <i class="bi bi-send fs-1"></i><!-- Bootstrap Icons, Typography -->
          </div>

          <h5 class="fw-bold mb-1">Your messages</h5><!-- Typography, Spacing -->
          <p class="text-secondary small mb-3">Send a message to start a chat.</p><!-- Colors, Typography, Spacing -->
          
          <!-- Botón de acción -->
          <button class="btn btn-primary px-3 py-1 rounded-3 fw-semibold">Send message</button><!-- Buttons, Spacing, Borders, Typography -->

        </div>

      </div>
    </div>
    <!--JS Bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
